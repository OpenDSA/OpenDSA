<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiple Brute Force Parse</title>
  <link rel="stylesheet" href="BruteForceParse.css">
</head>
<body class="multiple-parser">
  <h1>Multiple Brute Force Parse</h1>
  <p>Test multiple input strings with Run Inputs. Each row displays its acceptance result.</p>
  <nav id="modeCommands" class="mode-links" aria-label="Editor navigation"><button id="backbutton" type="button">Back to Grammar Editor</button></nav>
  <div class="parse-layout">
    <aside class="grammar-panel" aria-label="Grammar productions">
      <table id="grammar"><caption>Grammar</caption><thead><tr><th>Left</th><th></th><th>Right</th></tr></thead><tbody></tbody></table>
      <p class="grammar-note">The first rule defines the start symbol. Use ! or λ for the empty string; blank rows are skipped.</p>
    </aside>
    <main class="parse-workspace">
      <nav id="inputCommands" aria-label="Input commands"><button id="addinputbutton">Add Input</button><button id="deleterowbutton">Delete Row</button><button id="runinputsbutton">Run Inputs</button><button id="clearbutton">Clear All</button></nav>
      <p id="message" role="status"></p>
      <table id="table"><thead><tr><th>Input</th><th>Result</th></tr></thead><tbody></tbody></table>
    </main>
  </div>
  <script src="BruteForceParser.js"></script>
  <script src="BruteForceParseUI.js"></script>
  <script src="MBFParse.js"></script>
</body>
</html>
