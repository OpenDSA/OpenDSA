<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Convert NFA to DFA test</title>
			<link rel="stylesheet" href="../../lib/JSAV.css" type="text/css" media="screen" title="no title" charset="utf-8" />
			<link rel="stylesheet" href="../../lib/odsaAV.css" type="text/css" />
			<link rel="stylesheet" href="../../lib/odsaStyle.css" type="text/css" />
			<link rel="stylesheet" href="./css/FA.css" type="text/css" />
			<link rel="stylesheet" href="./css/tester.css" type="text/css" />
			<link rel="stylesheet" href="./css/NFAtoDFA.css" type="text/css" />


			<script src="../../lib/jquery.min.js"></script>
		    <link rel="stylesheet" type="text/css" href="../../lib/jquery.ui.min.css" />
		<style>
			#av {
      			text-align: center;
			}
			p.jsavoutput.jsavline {
				height: 10px;
			}
			.jsavcanvas{
				width: 45% !important;
				height: 445px !important;
			}
    		.jsavgraph {
    			display: inline-block;
    		}
    		#editable .jsavnode { cursor: pointer;}
    		#editable .jsavedge {
    			cursor: pointer;
    			stroke-width: 2;	/*can change to make edges easier to click */
    		}
    		#conversionButton {
    			display: none;
    		}
    		.jsavmodelanswer {
    			text-align: center;
    		}
		</style>
	</head>
	<body>

		<div id="container">
		<div id="av">
			<div style="display:inline;">
		        <div style="float: right;" id="menu_options">
		          <button type="button" id="saveButton">Save Machine</button>
		          <button type="button" id="completeButton">Complete</button>
				  <button type="button" id="checkDone">Done?</button>
				  <button type="button" id="exportButton">Export</button>
		        </div>
				<p class="jsavoutput jsavline"></p>
		      </div>
		    <div id="download"></div>
		    <br>
		    <br>
			<hr style="margin-top: 0px; border-top: 1px solid #333; margin-bottom: 0px;">

			<div id="graphs">
				<div id="reference" class="jsavcanvas"></div>
				<div id="editable" class="jsavcanvas"></div>
				<div id="answer" class="jsavcanvas"></div>
			</div>
		</div>
		<div align="right">
			<span id='mode'></span>
			<button type="button" id="conversionButton">Continue expanding</button>
			<!-- <button type="button" id="removenodesbutton" class="editButton">Remove nodes</button> -->
		</div>
		</div>
<script src="../../lib/jquery.migrate.min.js"></script>
		<script src="../../lib/jquery.ui.min.js"></script>
<script src="../../lib/timeme.js"></script>
		<script src="../../lib/jquery.transit.js"></script>
		<script src="../../lib/raphael.js"></script>
		<script src="../../lib/dagre.min.js"></script>
		<script src="../../lib/JSAV.js"></script>
		<script src="../../lib/odsaUtils.js"></script>
		<script src="../../lib/odsaAV.js"></script>
		<script src="../../DataStructures/FLA/serializableGraph.js"></script>
		<script src="../../lib/underscore.js"></script>
		<script src="../../DataStructures/FLA/FA.js"></script>
		<script src="./NFAtoDFA.js"></script>
   	</body>
  </html>
